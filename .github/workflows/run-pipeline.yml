name: Run Financial ML Preprocessing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing pipeline
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SOURCE_SHEET_ID: ${{ secrets.SOURCE_SHEET_ID }}
          DEST_SHEET_ID: ${{ secrets.DEST_SHEET_ID }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ] && [ -n "$APPS_SCRIPT_TOKEN" ] && [ -n "$SOURCE_SHEET_ID" ] && [ -n "$DEST_SHEET_ID" ]; then
            echo "Apps Script bridge configured — running full end-to-end Google Sheets pipeline..."
            python pipeline.py --backend webapp
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$SOURCE_SHEET_ID" ] && [ -n "$DEST_SHEET_ID" ]; then
            echo "Google Sheets API credentials found — running full end-to-end pipeline..."
            python pipeline.py --backend api
          else
            echo "::notice::No Google Sheets cloud credentials set yet (APPS_SCRIPT_URL + APPS_SCRIPT_TOKEN or GOOGLE_SERVICE_ACCOUNT_JSON). Running offline verification against data/raw/financial_data_raw.csv."
            python pipeline.py --skip-fetch --skip-upload
          fi

      - name: Upload processed CSV outputs
        uses: actions/upload-artifact@v4
        with:
          name: processed-ml-datasets
          path: data/processed/*.csv
          retention-days: 14
