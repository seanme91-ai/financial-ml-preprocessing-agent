name: Daily Financial Data Update, ML Preprocessing & Exploration Pipeline

on:
  schedule:
    # Runs Tue-Sat at 09:00 Asia/Singapore (01:00 UTC) to capture Mon-Fri settled closes
    - cron: "0 1 * * 2-6"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_daily_fetch:
        description: "Skip Agent 1 daily market fetch (run Agent 2 & Agent 3 only)"
        required: false
        default: false
        type: boolean
      skip_exploration:
        description: "Skip Agent 3 data exploration (PCA, Rolling PCA, FA, Clustering)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Agent 1: Fetch daily market data & update Financial Data Updates sheet"
        if: ${{ inputs.skip_daily_fetch != true }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          SOURCE_SHEET_ID: ${{ secrets.SOURCE_SHEET_ID }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ] && [ -n "$APPS_SCRIPT_TOKEN" ] && [ -n "$SOURCE_SHEET_ID" ]; then
            echo "Running Agent 1 (fetch_daily_data.py) via Apps Script bridge..."
            python fetch_daily_data.py --backend webapp
          else
            echo "::notice::APPS_SCRIPT_URL, APPS_SCRIPT_TOKEN, or SOURCE_SHEET_ID not set; skipping Agent 1 daily sheet update."
          fi

      - name: "Agent 2: Run causal ML preprocessing & publish 5 tabs"
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SOURCE_SHEET_ID: ${{ secrets.SOURCE_SHEET_ID }}
          DEST_SHEET_ID: ${{ secrets.DEST_SHEET_ID }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ] && [ -n "$APPS_SCRIPT_TOKEN" ] && [ -n "$SOURCE_SHEET_ID" ] && [ -n "$DEST_SHEET_ID" ]; then
            echo "Apps Script bridge configured — running full end-to-end Google Sheets pipeline..."
            python pipeline.py --backend webapp
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$SOURCE_SHEET_ID" ] && [ -n "$DEST_SHEET_ID" ]; then
            echo "Google Sheets API credentials found — running full end-to-end pipeline..."
            python pipeline.py --backend api
          else
            echo "::notice::No Google Sheets cloud credentials set yet. Running offline verification against data/raw/financial_data_raw.csv."
            python pipeline.py --skip-fetch --skip-upload
          fi

      - name: "Agent 3: Run PCA, Rolling PCA, Factor Analysis & Hierarchical Clustering (9 tabs)"
        if: ${{ inputs.skip_exploration != true }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEST_SHEET_ID: ${{ secrets.DEST_SHEET_ID }}
          EXPLORATION_SHEET_ID: ${{ secrets.EXPLORATION_SHEET_ID }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ] && [ -n "$APPS_SCRIPT_TOKEN" ] && [ -n "$EXPLORATION_SHEET_ID" ]; then
            echo "Running Agent 3 (data_exploration.py) from freshly processed Agent 2 dataset via Apps Script..."
            python data_exploration.py --skip-fetch --backend webapp
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$EXPLORATION_SHEET_ID" ]; then
            echo "Running Agent 3 (data_exploration.py) via Google Sheets API..."
            python data_exploration.py --skip-fetch --backend api
          else
            echo "::notice::EXPLORATION_SHEET_ID or Google Sheets cloud credentials not set. Running Agent 3 offline verification."
            python data_exploration.py --skip-fetch --skip-upload
          fi

      - name: Upload processed CSV outputs (Agent 2)
        uses: actions/upload-artifact@v4
        with:
          name: processed-ml-datasets
          path: data/processed/*.csv
          retention-days: 14

      - name: Upload data exploration CSV outputs (Agent 3)
        if: ${{ inputs.skip_exploration != true }}
        uses: actions/upload-artifact@v4
        with:
          name: data-exploration-outputs
          path: data/exploration/*.csv
          retention-days: 14
